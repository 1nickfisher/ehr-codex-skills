schema_version: 1

meta:
  skill: 42-cfr-part-2
  last_full_review:
    date: 2026-05-27
    reviewer: "@nick"
  fetch_notes: |
    The 2024 final rule (89 FR 12472) and the current 42 CFR Part 2 text are
    both directly fetchable:
      - govinfo.gov hosts the final-rule PDF (Cloudflare-served, real ETag).
      - The eCFR API exposes both the live Part 2 text and individual section
        XML. Section-level `type: ecfr` baselines give targeted change signals.

    The cross-referenced HIPAA sections (45 CFR §§ 164.404, 164.408, 164.514,
    164.522, 164.528, 160.404) are tracked the same way — section-level eCFR
    baselines.

    HHS / SAMHSA fact-sheet pages are Akamai-protected at the origin and
    cannot be hashed directly. The existing Wayback branch of check_sources.py
    filters CDX results to mimetype=application/pdf, so HTML-only HHS pages
    are not yet a viable `type: wayback` baseline — kept manual until the
    checker grows a text/html Wayback branch, or until each page has a
    Wayback-captured PDF/print variant.

    Statutory text (42 U.S.C. § 290dd-2, § 1320d-6) lives at law.cornell.edu
    in a format that does not have a stable extractable section anchor for
    automated hashing — kept as `type: manual` for now.

