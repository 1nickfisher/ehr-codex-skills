schema_version: 1

meta:
  skill: calmhsa-medi-cal-documentation
  last_full_review:
    date: 2026-05-26
    reviewer: "@nick"
  fetch_notes: |
    DHCS hosts many BHIN PDFs behind Imperva/Incapsula bot protection. Every
    direct PDF URL can return a small JavaScript challenge page regardless
    of User-Agent, so automated hash comparison against the canonical URLs
    is not reliable. For DHCS PDFs with verified Wayback Machine PDF captures,
    use `type: wayback` and compare the Internet Archive CDX digest plus the
    archived-byte SHA-256. Treat any digest change as a review signal, not as
    proof that the regulation changed. DHCS authorities without verified
    canonical PDF URLs remain `type: manual`.

    CalMHSA hosts its clinical documentation guides via Cloudflare; those
    are directly fetchable and have real SHA-256 baselines below.

