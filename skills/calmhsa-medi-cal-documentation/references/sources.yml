schema_version: 1

meta:
  skill: calmhsa-medi-cal-documentation
  last_full_review:
    date: 2026-05-26
    reviewer: "@nick"
  fetch_notes: |
    DHCS hosts BHIN PDFs behind Imperva/Incapsula bot protection. Every
    direct PDF URL returns a 212-byte JavaScript challenge page regardless
    of User-Agent, so automated hash comparison against the canonical URLs
    is not reliable. Those authorities are recorded here as `type: manual`
    for human reference; verify the BHIN library by hand on each review.
    If you need a fetchable baseline for a DHCS BHIN, point the URL at a
    county mirror with stable Last-Modified/ETag headers (Marin BHRS,
    Alameda BHCS, Solano County QI) and record the mirror URL alongside
    the canonical one.

    CalMHSA hosts its clinical documentation guides via Cloudflare; those
    are directly fetchable and have real SHA-256 baselines below.

sources:
